# =============================================================================
# GitHub Actions workflow: runs owasp-api-top10-swagger-petstore.yaml
# against the target API with Nuclei, validates the template first, and
# uploads the full results (plain + JSONL) as a build artifact.
#
# SETUP
#   1. Commit this file at:            .github/workflows/nuclei-owasp-api-top10-scan.yml
#   2. Commit the template at:         TEMPLATE_PATH below (default: repo root)
#   3. Trigger manually from the "Actions" tab (workflow_dispatch), or let
#      the weekly schedule run it.
#
# RESPONSIBLE USE — carried over from the template's own header
#   - This workflow defaults to the public petstore.swagger.io demo and is
#     intentionally NOT wired to push/pull_request, so it won't fire on
#     every commit against a shared public service. If you repoint it at
#     your own API, feel free to add push/pull_request triggers.
#   - The `race_count` bursts and mutating requests inside the template
#     itself are already kept low/safe for a shared demo — see the
#     template's own header before raising them.
#   - `concurrency` below prevents overlapping runs from stacking load on
#     the target if someone double-triggers the workflow.
# =============================================================================


name: Nuclei - OWASP API Top 10 (Swagger Petstore)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Authorized API base URL"
        required: false
        default: "https://petstore.swagger.io"
      template_path:
        description: "Nuclei template path"
        required: false
        default: "owasp-api-top10-swagger-petstore.yaml"

  

permissions:
  contents: read

concurrency:
  group: nuclei-owasp-api-top10-scan
  cancel-in-progress: true

env:
  TARGET: ${{ inputs.target || 'https://petstore.swagger.io' }}
  TEMPLATE_PATH: ${{ inputs.template_path || 'owasp-api-top10-swagger-petstore.yaml' }}

jobs:
  nuclei-scan:
    name: Validate and run Nuclei scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: Install Nuclei
        env:
          GOTOOLCHAIN: auto
        run: |
          go version
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Print Nuclei version
        run: nuclei -version

      - name: Check template exists
        run: |
          if [ ! -f "$TEMPLATE_PATH" ]; then
            echo "::error::Template not found: $TEMPLATE_PATH"
            exit 1
          fi

      - name: Validate template
        run: |
          nuclei -t "$TEMPLATE_PATH" -validate -duc

      - name: Prepare results directory
        run: |
          mkdir -p nuclei-results

      - name: Run Nuclei scan and export reports
        id: scan
        run: |
         mkdir -p nuclei-results
        
          nuclei \
            -t "$TEMPLATE_PATH" \
            -u "$TARGET" \
            -duc \
            -nc \
            -o nuclei-results/results.txt \
            -je nuclei-results/results.json \
            -jle nuclei-results/results.jsonl \
            -stats \
            -timeout 15 \
            -retries 1

      - name: Normalize reports and generate HTML
        if: always()
        run: |
          mkdir -p nuclei-results

          # Ensure all expected files exist.
          touch nuclei-results/results.txt
          touch nuclei-results/results.jsonl

          # An empty JSON export means no findings were exported.
          if [ ! -s nuclei-results/results.json ]; then
            echo "[]" > nuclei-results/results.json
          fi

          # Validate JSON and generate a readable HTML report.
          python3 <<'PY'
          import json
          import html
          from pathlib import Path
          from datetime import datetime, timezone

          directory = Path("nuclei-results")
          json_file = directory / "results.json"

          try:
              data = json.loads(json_file.read_text())
          except (json.JSONDecodeError, OSError) as exc:
              raise SystemExit(f"Invalid Nuclei JSON export: {exc}")

          formatted = json.dumps(data, indent=2, ensure_ascii=False)
          findings = len(data) if isinstance(data, list) else 1

          page = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Nuclei API Security Scan Report</title>
          <style>
          body {{
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
            margin: 30px;
          }}
          main {{
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
          }}
          h1 {{ color: #17365d; }}
          pre {{
            background: #17212b;
            color: #e6edf3;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
          }}
          .metadata {{
            background: #edf2f7;
            padding: 15px;
            border-radius: 8px;
          }}
          </style>
          </head>
          <body>
          <main>
          <h1>Nuclei API Security Scan Report</h1>
          <div class="metadata">
          <p><b>Target:</b> {html.escape(__import__('os').environ.get('TARGET', ''))}</p>
          <p><b>Template:</b> {html.escape(__import__('os').environ.get('TEMPLATE_PATH', ''))}</p>
          <p><b>Findings:</b> {findings}</p>
          <p><b>Generated:</b> {datetime.now(timezone.utc).isoformat()}</p>
          </div>
          <h2>Scan Results (JSON)</h2>
          <pre>{html.escape(formatted)}</pre>
          </main>
          </body>
          </html>"""

          (directory / "report.html").write_text(page, encoding="utf-8")

          # Validate JSONL independently.
          jsonl_file = directory / "results.jsonl"
          for number, line in enumerate(
              jsonl_file.read_text().splitlines(), start=1
          ):
              try:
                  json.loads(line)
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      f"Invalid JSONL at line {number}: {exc}"
                  )

          print(f"Validated JSON report: {json_file}")
          print(f"Findings: {findings}")
          print("Generated HTML report successfully.")
          PY

      - name: Write GitHub Actions summary
        if: always()
        run: |
          COUNT=$(wc -l < nuclei-results/results.jsonl | tr -d ' ')

          {
            echo "## Nuclei API Security Scan"
            echo ""
            echo "- **Target:** $TARGET"
            echo "- **Template:** $TEMPLATE_PATH"
            echo "- **Findings:** $COUNT"
            echo ""
            echo "### Generated Reports"
            echo "- results.txt"
            echo "- results.json"
            echo "- results.jsonl"
            echo "- report.html"
            echo ""
            if [ "$COUNT" -gt 0 ]; then
              echo "Security findings were detected. Review the reports."
            else
              echo "No findings were exported. This does not guarantee the API is secure."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Nuclei scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuclei-scan-results
          path: nuclei-results/
          retention-days: 14
          if-no-files-found: warn


      # ---------------------------------------------------------------------
      # OPTIONAL: fail the build when anything matches. Left disabled by
      # default because several checks in this template are EXPECTED to
      # match against a deliberately permissive public demo. Enable this
      # once you point TARGET at your own API and want CI to break on find.
      # ---------------------------------------------------------------------
